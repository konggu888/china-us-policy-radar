name: AI Strategic Intelligence Analysis

on:
  # DeepSeek peak hours are 01:00-04:00 and 06:00-10:00 UTC on weekdays.
  # Run at 04:20-04:55 UTC (12:20-12:55 Beijing) to use off-peak pricing.
  schedule:
    - cron: '20 4 * * *'       # daily 12:20 Beijing
    - cron: '30 4 * * 1'       # weekly Monday
    - cron: '40 4 1 * *'       # monthly
    - cron: '50 4 1 1,4,7,10 *' # quarterly
    - cron: '55 4 1 1,7 *'     # half-year
  workflow_dispatch:
    inputs:
      period:
        description: 'daily / weekly / monthly / quarterly / half_year'
        required: true
        default: 'daily'

permissions:
  contents: write

jobs:
  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run DeepSeek cost-optimized analysis
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
        run: |
          set -e
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              python scripts/ai_intelligence.py "${{ github.event.inputs.period }}"
            else
              python scripts/ai_intelligence.py daily
              day=$(date -u +%u); dom=$(date -u +%d); month=$(date -u +%m)
              if [ "$day" = "1" ]; then python scripts/ai_intelligence.py weekly; fi
              if [ "$dom" = "01" ]; then python scripts/ai_intelligence.py monthly; fi
              case "$month-$dom" in 01-01|04-01|07-01|10-01) python scripts/ai_intelligence.py quarterly ;; esac
              case "$month-$dom" in 01-01|07-01) python scripts/ai_intelligence.py half_year ;; esac
            fi
          else
            echo 'DEEPSEEK_API_KEY is not configured; skipping AI calls safely.'
          fi
      - name: Commit AI intelligence
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ai_summaries.json data/news.json
          git diff --cached --quiet || git commit -m 'chore: update AI strategic intelligence'
          git push
