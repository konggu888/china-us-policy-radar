name: AI Strategic Intelligence Analysis

on:
  push:
    paths:
      - 'scripts/ai_intelligence.py'
      - 'scripts/market_sectors.py'
      - 'scripts/enrich_dashboard.py'
      - 'scripts/build_timeline.py'
      - 'home.js'
      - 'ui-enhancements.js'
  schedule:
    - cron: '15,45 * * * *'
    - cron: '20 4 * * *'
    - cron: '30 4 * * 1'
    - cron: '40 4 1 * *'
    - cron: '50 4 1 1,4,7,10 *'
    - cron: '55 4 1 1,7 *'
  workflow_run:
    workflows: ['Update Intelligence Radar']
    types: [completed]
  workflow_dispatch:
    inputs:
      period:
        description: 'classify / daily / weekly / monthly / quarterly / half_year'
        required: true
        default: 'classify'

permissions:
  contents: write

concurrency:
  group: intelligence-radar-ai
  cancel-in-progress: false

jobs:
  ai:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run DeepSeek classification and summaries
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
        run: |
          set -e
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo 'DEEPSEEK_API_KEY is not configured; no DeepSeek API call was made.'
            python scripts/ai_intelligence.py classify
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/ai_intelligence.py "${{ github.event.inputs.period }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            python scripts/ai_intelligence.py classify
            python scripts/ai_intelligence.py daily
          elif [ "${{ github.event_name }}" = "push" ]; then
            # Bootstrap all requested horizons immediately after this workflow configuration changes.
            python scripts/ai_intelligence.py classify
            python scripts/ai_intelligence.py daily
            python scripts/ai_intelligence.py weekly
            python scripts/ai_intelligence.py monthly
            python scripts/ai_intelligence.py quarterly
            python scripts/ai_intelligence.py half_year
          else
            python scripts/ai_intelligence.py classify
            hour=$(date -u +%H); minute=$(date -u +%M); day=$(date -u +%u); dom=$(date -u +%d); month=$(date -u +%m)
            if [ "$hour" = "04" ] && [ "$minute" = "20" ]; then python scripts/ai_intelligence.py daily; fi
            if [ "$hour" = "04" ] && [ "$minute" = "30" ] && [ "$day" = "1" ]; then python scripts/ai_intelligence.py weekly; fi
            if [ "$hour" = "04" ] && [ "$minute" = "40" ] && [ "$dom" = "01" ]; then python scripts/ai_intelligence.py monthly; fi
            if [ "$hour" = "04" ] && [ "$minute" = "50" ]; then case "$month-$dom" in 01-01|04-01|07-01|10-01) python scripts/ai_intelligence.py quarterly ;; esac; fi
            if [ "$hour" = "04" ] && [ "$minute" = "55" ]; then case "$month-$dom" in 01-01|07-01) python scripts/ai_intelligence.py half_year ;; esac; fi
          fi
      - name: Commit AI intelligence and health
        if: ${{ always() }}
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git add data/ai_summaries.json data/news.json data/ai_health.json
            git diff --cached --quiet || git commit -m 'chore: update AI strategic intelligence'
            git fetch origin main
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard origin/main
            git clean -fd
            sleep $((attempt * 5))
          done
          echo 'Failed to push AI results after 3 attempts.'
          exit 1
