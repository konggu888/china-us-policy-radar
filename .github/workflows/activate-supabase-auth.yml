name: Validate Supabase account auth

on:
  push:
    paths:
      - 'scripts/scenario_auth_supabase.js'
      - 'scripts/activate_supabase_auth.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate activation script
        run: python -m py_compile scripts/activate_supabase_auth.py
