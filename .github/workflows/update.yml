name: Update Intelligence Radar

on:
  schedule:
    - cron: '7,37 * * * *'
  push:
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect and diagnose
        shell: bash
        run: |
          set +e
          python scripts/collect_news.py
          collect_rc=$?
          policy_collect_rc=0
          enrich_rc=0
          policy_rc=0
          if [ "$collect_rc" -eq 0 ]; then
            python scripts/collect_policy_sources.py
            policy_collect_rc=$?
            python scripts/enrich_dashboard.py
            enrich_rc=$?
            if [ "$enrich_rc" -eq 0 ]; then
              python scripts/enrich_policy.py
              policy_rc=$?
            fi
          fi

          python - "$collect_rc" "$policy_collect_rc" "$enrich_rc" "$policy_rc" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          path=Path('data/dashboard.json')
          health=Path('data/collection_health.json')
          try: dash=json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          except Exception: dash={}
          try: h=json.loads(health.read_text(encoding='utf-8')) if health.exists() else {}
          except Exception: h={}
          rc=[int(x) for x in sys.argv[1:]]
          pipeline_ok=all(x==0 for x in rc)
          total=int(h.get('total_collected',0)); direct=int(h.get('direct_source_count',0)); gdelt=int(h.get('gdelt_count',0))
          status='success' if pipeline_ok and total>0 else ('partial' if pipeline_ok and total==0 else 'failed')
          now=datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          dash['updated']=now
          dash['collection_status']=status
          dash['collection_message']=f'采集健康度：总数据 {total} 条；直连官方源 {direct} 条；GDELT {gdelt} 条。GDELT 无数据时自动保留直连源结果。'
          dash['collection_time_utc']=now
          dash['source_health']=h.get('sources',{})
          dash['collection_pipeline_rc']=rc
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(dash,ensure_ascii=False,indent=2),encoding='utf-8')
          print(dash['collection_message'])
          PY
          exit $(( collect_rc != 0 || policy_collect_rc != 0 || enrich_rc != 0 || policy_rc != 0 ))

      - name: Commit data
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*.json
          git diff --cached --quiet || git commit -m 'chore: update intelligence feed, policy sources and radar'
          git push
