name: Migrate scenario task UI to Supabase

on:
  push:
    paths:
      - 'scripts/migrate_supabase_task_ui.py'
      - 'scenario.html'
      - '.github/workflows/migrate-supabase-task-ui.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'migrate: supabase task ui') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch scenario task persistence
        run: python scripts/migrate_supabase_task_ui.py
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No migration changes needed.'
            exit 0
          fi
          git add scenario.html
          git commit -m 'migrate: supabase task ui'
          git push origin HEAD:main
