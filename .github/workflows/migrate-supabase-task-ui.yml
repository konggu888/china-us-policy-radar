name: Validate scenario task migration

on:
  push:
    paths:
      - 'scripts/migrate_supabase_task_ui.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate migration script
        run: python -m py_compile scripts/migrate_supabase_task_ui.py
